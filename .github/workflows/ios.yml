name: iOS

# Runs on a GitHub-hosted Mac, so the app gets compiled, tested and
# screenshotted even if you only own a Windows machine.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Liquid Glass (`glassEffect`) needs the iOS 26 SDK, which means Xcode 26.
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Runner images ship several Xcodes; always take the newest so the
      # iOS 26 SDK is the one in use.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Device names change with every Xcode, so resolve one at runtime
      # instead of pinning "iPhone 16".
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -E "^\s+iPhone" \
            | tail -1 \
            | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available"; xcrun simctl list devices available; exit 1
          fi
          NAME=$(xcrun simctl list devices available | grep "$UDID" | sed -E 's/^ *([^(]+).*/\1/' | xargs)
          echo "Using $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Tee to a plain-text file. The .xcactivitylog artifact is a truncated
      # binary blob that does not contain the diagnostics; this does.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-build.log

      - name: Test OrbitCore
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme OrbitKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../../xcodebuild-test.log
        working-directory: Packages/OrbitKit

      # Prints just the diagnostics into the step output, so the failure is
      # readable on the Actions page without downloading anything.
      - name: Diagnostics
        if: failure()
        run: |
          echo "::group::Errors"
          grep -hnE "error:|fatal error:|Undefined symbol|linker command failed|XCTAssert" \
            xcodebuild-*.log 2>/dev/null | head -80 || echo "no error lines found"
          echo "::endgroup::"
          echo "::group::Last 60 lines"
          tail -n 60 xcodebuild-build.log 2>/dev/null || true
          echo "::endgroup::"

      # Every screen, both appearances. The app reads `-uiRoute` out of the
      # argument domain of UserDefaults and opens straight onto that screen,
      # which is far less brittle than driving XCUITest just to take pictures.
      - name: Screenshot every screen
        if: success()
        run: |
          mkdir -p screenshots
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=$(find build/Build/Products -name "Orbit.app" -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"

          # Every screen the app has. Keep in step with ScreenshotRoute —
          # anything missing here simply never gets photographed.
          ROUTES="chats conversation newChat calls contacts settings \
                  profile editProfile qrCode \
                  notifications privacy blocked appearance \
                  dataStorage storage devices folders saved \
                  language help about"

          for MODE in light dark; do
            xcrun simctl ui "$UDID" appearance "$MODE"
            for ROUTE in $ROUTES; do
              xcrun simctl terminate "$UDID" com.orbit.app 2>/dev/null || true
              xcrun simctl launch "$UDID" com.orbit.app -uiRoute "$ROUTE"
              sleep 4
              xcrun simctl io "$UDID" screenshot "screenshots/$MODE-$ROUTE.png"
            done
          done

          xcrun simctl terminate "$UDID" com.orbit.app 2>/dev/null || true
          ls -la screenshots

      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/*.png

      # Screenshots cannot show the tab-bar bubble tracking a finger, or a
      # push transition. This drives the app with a UI test while simctl
      # records the screen, and uploads the clip.
      - name: Record the motion tour
        if: success()
        # The clip is the deliverable here, not a pass mark. A flaky tour must
        # not cost us the IPA, so the step reports its failure without taking
        # the job down with it.
        continue-on-error: true
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p media
          xcrun simctl ui "$UDID" appearance dark

          xcrun simctl io "$UDID" recordVideo --codec h264 --force media/tour-dark.mp4 &
          REC=$!
          sleep 2

          set +e
          xcodebuild test \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination "id=$UDID" \
            -only-testing:OrbitUITests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-uitest.log | tail -n 25
          STATUS=${PIPESTATUS[0]}
          set -e

          # recordVideo only finalises the container on SIGINT.
          sleep 1
          kill -INT "$REC" 2>/dev/null || true
          wait "$REC" 2>/dev/null || true

          ls -lh media || true
          exit "$STATUS"

      - name: Upload the tour video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-tour
          path: media/*.mp4
          if-no-files-found: warn

      # An unsigned device build, for sideloading onto a real iPhone.
      #
      # Signing needs an Apple certificate and a Mac keychain, so CI does not
      # sign at all — the sideloading tool on your machine re-signs it with
      # your own Apple ID. That is what makes this possible from Windows.
      - name: Package unsigned IPA
        if: success()
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'generic/platform=iOS' \
            -archivePath build/Orbit.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild-archive.log | tail -n 15

          APP="build/Orbit.xcarchive/Products/Applications/Orbit.app"
          test -d "$APP" || { echo "archive produced no app"; exit 1; }

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Orbit-unsigned.ipa Payload
          ls -lh Orbit-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-unsigned-ipa
          path: Orbit-unsigned.ipa

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild-build.log
            xcodebuild-test.log
          if-no-files-found: ignore
