name: iOS

# Runs on a GitHub-hosted Mac, so the app gets compiled, tested and
# screenshotted even if you only own a Windows machine.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Compiles the app and all three package targets. This is the step that
      # surfaces every syntax and type error — read its log first.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # OrbitCore has no UI, so these prove the data layer independently.
      - name: Test OrbitCore
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme OrbitKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
        working-directory: Packages/OrbitKit

      # Launches the built app in a simulator and captures what it looks like,
      # in light and dark. Download these from the run's Artifacts section.
      - name: Screenshot the running app
        if: success()
        run: |
          mkdir -p screenshots
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 16 (" | grep -oE "[0-9A-F-]{36}")
          echo "Using simulator $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

          APP=$(find build/Build/Products -name "Orbit.app" -maxdepth 3 | head -1)
          echo "Installing $APP"
          xcrun simctl install "$DEVICE" "$APP"

          for MODE in light dark; do
            xcrun simctl ui "$DEVICE" appearance "$MODE"
            xcrun simctl launch "$DEVICE" com.orbit.app
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "screenshots/chats-$MODE.png"
            xcrun simctl terminate "$DEVICE" com.orbit.app || true
          done

      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/*.png

      # Kept even when the build fails — this is the log to send back.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/Logs/**
          if-no-files-found: ignore
