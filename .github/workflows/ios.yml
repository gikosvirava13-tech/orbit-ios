name: iOS

# Runs on a GitHub-hosted Mac, so the app gets compiled, tested and
# screenshotted even if you only own a Windows machine.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Liquid Glass (`glassEffect`) needs the iOS 26 SDK, which means Xcode 26.
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Runner images ship several Xcodes; always take the newest so the
      # iOS 26 SDK is the one in use.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Device names change with every Xcode, so resolve one at runtime
      # instead of pinning "iPhone 16".
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -E "^\s+iPhone" \
            | tail -1 \
            | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available"; xcrun simctl list devices available; exit 1
          fi
          NAME=$(xcrun simctl list devices available | grep "$UDID" | sed -E 's/^ *([^(]+).*/\1/' | xargs)
          echo "Using $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Test OrbitCore
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme OrbitKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
        working-directory: Packages/OrbitKit

      - name: Screenshot the running app
        if: success()
        run: |
          mkdir -p screenshots
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=$(find build/Build/Products -name "Orbit.app" -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"

          for MODE in light dark; do
            xcrun simctl ui "$UDID" appearance "$MODE"
            xcrun simctl launch "$UDID" com.orbit.app
            sleep 7
            xcrun simctl io "$UDID" screenshot "screenshots/chats-$MODE.png"
            xcrun simctl terminate "$UDID" com.orbit.app || true
          done

      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/*.png

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/Logs/**
          if-no-files-found: ignore
