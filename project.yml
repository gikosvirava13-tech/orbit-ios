# XcodeGen spec — `xcodegen generate` produces Totem.xcodeproj.
#
# The project file is generated rather than committed so there is no .pbxproj
# to merge-conflict over, which is the same reason telegram-ios generates its
# project from Bazel rather than checking one in.
name: Totem
options:
  bundleIdPrefix: com.totem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your team here, or pick one in Signing & Capabilities
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  TotemKit:
    path: Packages/TotemKit

# Declared explicitly so CI can rely on the scheme name existing.
schemes:
  Totem:
    build:
      targets:
        Totem: all
        TotemUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TotemUITests

targets:
  Totem:
    type: application
    platform: iOS
    sources:
      - path: App
    # Committed with empty values, and it optionally includes a gitignored
    # Secrets.local.xcconfig. A build with neither still compiles and runs —
    # it just falls back to the in-memory backend, which is what CI wants.
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: TotemKit
        product: TotemCore
      - package: TotemKit
        product: TotemUI
      - package: TotemKit
        product: TotemFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.totem.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Totem
        # Surfaced to the app through Info.plist. Empty in CI, which is how
        # BackendConfiguration.fromBundle knows to return nil.
        INFOPLIST_KEY_SupabaseProjectRef: "$(SUPABASE_PROJECT_REF)"
        INFOPLIST_KEY_SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # Exists to drive the app for the recorded tour, not to test behaviour —
  # the logic tests live in TotemCoreTests and need no simulator.
  TotemUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Totem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.totem.app.uitests
        TEST_TARGET_NAME: Totem
        GENERATE_INFOPLIST_FILE: YES
