# XcodeGen spec — `xcodegen generate` produces Orbit.xcodeproj.
#
# The project file is generated rather than committed so there is no .pbxproj
# to merge-conflict over, which is the same reason telegram-ios generates its
# project from Bazel rather than checking one in.
name: Orbit
options:
  bundleIdPrefix: com.orbit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your team here, or pick one in Signing & Capabilities
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  OrbitKit:
    path: Packages/OrbitKit

# Declared explicitly so CI can rely on the scheme name existing.
schemes:
  Orbit:
    build:
      targets:
        Orbit: all
        OrbitUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OrbitUITests

targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: OrbitKit
        product: OrbitCore
      - package: OrbitKit
        product: OrbitUI
      - package: OrbitKit
        product: OrbitFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Orbit
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # Exists to drive the app for the recorded tour, not to test behaviour —
  # the logic tests live in OrbitCoreTests and need no simulator.
  OrbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Orbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.app.uitests
        TEST_TARGET_NAME: Orbit
        GENERATE_INFOPLIST_FILE: YES
